databases:
  - name: nad_a3
    plan: free
    databaseName: mysite
    user: mysite

services:
  - type: web
    plan: free
    name: posts_proj
    runtime: python
    buildCommand: './build.sh'
    startCommand: 'python -m gunicorn posts_proj.asgi:application -k uvicorn.workers.UvicornWorker'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nad_a3
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4